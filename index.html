<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Gomelas Shop</title>
    <style>
        body {
            background-color: #FFBDF8;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: sans-serif; /* Hace que la letra se vea más moderna */
        }

        .contenedor-centrado {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Estilo específico para tu LOGO principal */
        .logo-principal {
            max-width: 150px; /* Tamaño ideal para que no ocupe toda la pantalla */
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 50%; /* Lo hace perfectamente redondo */
            margin-bottom: 20px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1); /* Sombra suave elegante */
        }

        h1 {
            color: #C0C0C0;
            font-weight: bold;
            display: block;
            margin-bottom: 20px;
        }

        .descripcion {
            max-width: 700px;
            line-height: 1.6;
            font-size: 18px;
            margin-bottom: 20px;
        }

        p {
            margin-bottom: 8px;
        }

        .REDES {
            margin-top: 5px;
        }

        /* Estilo para los bloques de tus enlaces */
        .REDES a {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            color: #C0C0C0;
            font-weight: bold;
            margin-bottom: 15px; /* Espacio vertical entre cada red social */
        }

        /* Estilo para los iconos de tus redes sociales */
        .icono-red-social {
            width: 35px;
            height: 35px;
            object-fit: cover;
            margin-right: 10px; /* Separa el icono del texto del enlace */
            border-radius: 8px; /* Bordes ligeramente suaves para los iconos */
        }
    </style>
</head>
<body>

<div class="contenedor-centrado">
    
    <h1>Gomelas Shop</h1>
    
    <!-- Tu logo principal redondo -->
    <img class="logo-principal" src="gomelas.jpg" alt="Logo Gomelas Shop">

    <div class="descripcion">
        <p>Lencería para dama de todo tipo</p>
        <p>Encuéntranos en nuestras redes sociales</p>
    </div>

    <div class="REDES">
        <!-- Enlace 1: -->
        <a href="https://instagram.com" target="_blank">
            <img class="icono-red-social" src="instagram.jpg" alt="Instagram">
            Instagram Oficial
        </a><br>

        <!-- Enlace 2:  -->
        <a href="https://instagram.com" target="_blank">
            <img class="icono-red-social" src="whatsApp.jpg" alt="Whatsapp">
            WhatsApp Oficial
        </a><br>

      
        <a href="https://instagram.com" target="_blank">
            <img class="icono-red-social" src="tiktok.jpg" alt="Tiktok">
            Tiktok Oficial
        </a><br>
    </div>

</div>

</body>
