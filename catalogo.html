     /* Contenedor general de productos */
.productos-contenedor {
    display: grid !important;
    grid-template-columns: repeat(autofit, minmax(280px, 1fr)) !important;
    gap: 30px;
    padding: 30px;;
    max-width: 1200px;
    margin: 0 auto;
    box-sizing: border-box !important
}

/* Tarjeta de Producto Corregida */
.producto-tarjeta {
    background: #ffffff;
    border: 1px solid #ffdcfb;
    border-radius: 12px;
    padding: 15px;
    box-shadow: 0 4px 10px rgba(255, 189, 248, 0.15);
    width: 100% 
    max-width: 280px
    display: flex !important;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.3s ease;
    margin: 0 auto !important;
    box-sizing: border-box !important;
}
        .producto-tarjeta:hover {
            tarnsform: translateY(-5px);
            box-shadow: 0 6px 15px rgba(255, 189, 240, 0.25);
        }

.producto-imagen {
    width: 50%;
    height: 50px;
    object-fit: cover !important; 
    border-radius: 8px;
    margin-bottom: 10px !important;
}

.producto-titulo {
    font-size: 1.1rem;
    margin: 10px 0 5px 0;
    color: #333333;
}

.producto-precio {

}

/* Contenedor de Selectores (Talla, Color, Piezas) */

}

.opcion-grupo {

    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;

.opcion-grupo label {
    font-size: 0.9rem;

.opcion-grupo select {

.opcion-grupo select:focus {

/* Botón Agregar al Carrito con tu Color #FFBDF8 */

    <script>
        
       // Aseguramos que el carrito exista globalmente una sola vez
if (typeof carrito === 'undefined') {
    var carrito = [];
}

// 1. ESCUCHAR CUANDO SE AGREGA UN PRODUCTO AL CARRITO (CORREGIDO A BTN-AGG)
document.addEventListener('click', function(e) {
    // CORRECCIÓN MAESTRA: Ahora busca estrictamente la clase de tus botones reales
    if (e.target && e.target.classList.contains('btn-agg')) {
        const contenedor = e.target.closest('.producto-tarjeta'); 
        if (!contenedor) return;

        let precioSucio = contenedor.dataset.precio || contenedor.dataset.price || "0";
        let precioLimpio = precioSucio.replace('$', '').trim();

        const selectTalla = contenedor.querySelector('.prod-talla');
        const selectColor = contenedor.querySelector('.prod-color');
        const selectPiezas = contenedor.querySelector('.prod-piezas');

        const producto = {
            id: contenedor.dataset.id || "0",
            nombre: contenedor.dataset.nombre || "Producto",
            talla: selectTalla ? selectTalla.value : "N/A",
            color: selectColor ? selectColor.value : "N/A",
            piezas: selectPiezas ? selectPiezas.value : "N/A",
            precio: parseFloat(precioLimpio) || 0,
            cantidad: 1
        };

        carrito.push(producto);
        alert(`✨ ${producto.nombre} agregado al carrito con éxito`);
        actualizarTotalPagina();
    }
});

// 2. ACTUALIZAR PRECIO EN PANTALLA AL CAMBIAR DE TALLA (BRASIER)
document.addEventListener('change', function(e) {
    if (e.target && e.target.classList.contains('selector-precio')) {
        const tarjeta = e.target.closest('.producto-tarjeta');
        const opcionSeleccionada = e.target.options[e.target.selectedIndex];
        
        let nuevoPrecioSucio = opcionSeleccionada.dataset.precio || opcionSeleccionada.dataset.price;
        if (tarjeta && nuevoPrecioSucio) {
            let nuevoPrecioLimpio = nuevoPrecioSucio.replace('$', '').trim();
            
            tarjeta.dataset.precio = nuevoPrecioLimpio;
            tarjeta.dataset.price = nuevoPrecioLimpio;
            
            const precioTxt = tarjeta.querySelector('.producto-precio-visible');
            if (precioTxt) {
                precioTxt.innerText = `$${parseFloat(nuevoPrecioLimpio).toFixed(2)}`;
            }
        }
    }
});

// 3. ENVIAR EL PEDIDO DETALLADO Y SUMADO A WHATSAPP
function enviarPedidoWhatsapp() {
    const telefonoWhatsapp = "584244292903";
    let mensaje = "¡Hola Gomelas Shop! Quiero realizar el siguiente pedido de lencería:\n\n";
    let totalCompra = 0;
    
    if (carrito.length === 0) {
        alert("⚠️ Tu carrito está vacío. Agrega algunos productos antes de pagar.");
        return;
    }
    
    carrito.forEach((data, index) => {
        const precioUnitario = data.precio || 0; 
        const subtotal = precioUnitario * data.cantidad;
        totalCompra += subtotal;

        mensaje += `*${index + 1}. ${data.nombre}*\n`;
        if (data.talla !== "N/A") mensaje += `  • Talla: ${data.talla}\n`;
        if (data.color !== "N/A") mensaje += `  • Color: ${data.color}\n`;
        if (data.piezas !== "N/A") mensaje += `  • Estilo: ${data.piezas}\n`;
        mensaje += `  • Cantidad: ${data.cantidad}\n`;
        mensaje += `  • Precio: $${precioUnitario.toFixed(2)}\n\n`;
    });

    mensaje += `💰 *Total del Pedido:* $${totalCompra.toFixed(2)}\n\n`;
    mensaje += "¿Me indican los métodos de pago y disponibilidad?";

    const mensajeUrl = encodeURIComponent(mensaje);
    const urlWhatsapp = `https://wa.me/584244292903?text=${mensajeUrl}`;

    window.open(urlWhatsapp, '_blank');
}

// 4. ESCUCHAR EL BOTÓN DE PAGO FINAL
document.addEventListener('click', function(e) {
    if (e.target && (e.target.id === 'btn-pagar' || e.target.classList.contains('btn-pagar'))) {
        enviarPedidoWhatsapp();
    }
});

        // FUNCIÓN PARA ACTUALIZAR EL TOTAL VISIBLE EN LA INTERFAZ DE LA PÁGINA
function actualizarTotalPagina() {
    let total = 0;
    carrito.forEach(data => {
        total += parseFloat(data.precio) * (data.cantidad || 1);
    });
    
    // El script busca las formas más comunes en que pudiste nombrar el total en tu HTML
    const elementoTotal = document.querySelector('.total-carrito') || 
                          document.querySelector('.monto-total') || 
                          document.getElementById('total-precio') ||
                          document.querySelector('.precio-total');
                          
    if (elementoTotal) {
        elementoTotal.innerText = `${total.toFixed(2)}`;
    }
}
