    <style>
        body {
            background-color: #FFBDF8;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            color: #333333;
        }

        .encabezado {
            text-align: center;
            margin-bottom: 30px;
        }

        .encabezado h1 {
            color: #black;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.15);
            margin-bottom: 10px;
        }

        /* Botón elegante para regresar a la página principal */
        .btn-regresar {
            display: inline-block;
            text-decoration: none;
            background-color: #ffffff;
            color: #FFBDF8;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }

        .btn-regresar:hover {
            transform: scale(1.05);
        }
        
         .btn-agg {
            display: inline-block;
            text-decoration: none;
            background-color: #ffffff;
            color: #FFBDF8;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }

        .btn-agg:hover {
            transform: scale(1.10);
        }

        /* Cuadrícula organizada para los productos */
        .cuadricula-productos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Tarjeta individual de cada producto */
        .tarjeta-producto {
            background-color: #ffffff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.08);
            text-align: center;
            padding-bottom: 15px;
        }

        .tarjeta-producto img {
            width: 100%;
            height: 300px;
            object-fit: cover; /* Evita que la foto de la prenda se deforme */
        }

        .tarjeta-producto h3 {
            margin: 15px 10px 5px 10px;
            font-size: 18px;
            color: #555555;
        }

        .tarjeta-producto .precio {
            font-size: 16px;
            font-weight: bold;
            color: #black;
            background-color: #fff0fc;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 15px;
            margin-bottom: 10px;
        }
         <link href="https://googleapis.com" rel="stylesheet">
    </style>
</head>

    <script>
        let carrito= [];
        document.querySelectorAll('btn-agregar').forEach(boton=> {
            boton.addEvenListener('click',(e) => {
                const contenedor = e.taregt.closet('.producto');
                const producto = {
                    id: contenedor.dataset.id,
                    nombre: contenedor.dataset.nombre,
                    talla: contenedor.querySelector('producto-talla').value,
                    color: contenedor.querySelector('producto-color').value,
                    piezas: contenedor.querySelector('producto-piezas').value,
                    cantidad: 1
                };
                carrito.push(producto);
                alert(`${producto-nombre} agregador al carrito`);
            });
        });
