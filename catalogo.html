     /* Contenedor general de productos */
.productos-contenedor {
    display: grid !important;
    grid-template-columns: repeat(autofit, minmax(280px, 1fr)) !important;
    gap: 30px;
    padding: 30px;;
    max-width: 1200px;
    margin: 0 auto;
    box-sizing: border-box !important
}

/* Tarjeta de Producto Corregida */
.producto-tarjeta {
    background: #ffffff;
    border: 1px solid #ffdcfb;
    border-radius: 12px;
    padding: 15px;
    box-shadow: 0 4px 10px rgba(255, 189, 248, 0.15);
    width: 100% 
    max-width: 280px
    display: flex !important;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.3s ease;
    margin: 0 auto !important;
    box-sizing: border-box !important;
}
        .producto-tarjeta:hover {
            tarnsform: translateY(-5px);
            box-shadow: 0 6px 15px rgba(255, 189, 240, 0.25);
        }

.producto-imagen {
    width: 100%;
    height: 250px;
    object-fit: cover !important; 
    border-radius: 8px;
    margin-bottom: 10px !important;
}

.producto-titulo {
    font-size: 1.1rem;
    margin: 10px 0 5px 0;
    color: #333333;
}

.producto-precio {
    font-weight: bold;
    color: #cc60c3; /* Un tono rosa oscuro para que resalte el precio y sea legible */
    margin-bottom: 10px;
}

/* Contenedor de Selectores (Talla, Color, Piezas) */
.producto-opciones {
    margin-bottom: 15px;
}

.opcion-grupo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
}

.opcion-grupo label {
    font-size: 0.9rem;
    color: #555555;
}

.opcion-grupo select {
    padding: 6px;
    border-radius: 6px;
    border: 1px solid #ffbdf8;
    background-color: #fff8fe;
    width: 65%;
    font-size: 0.85rem;
    color: #333333;
}

.opcion-grupo select:focus {
    outline: none;
    border-color: #cc60c3;
}

/* Botón Agregar al Carrito con tu Color #FFBDF8 */
.btn-agregar {
    background-color: #FFBDF8;
    color: #4a1543; /* Texto oscuro para que contraste perfectamente sobre el rosa pastel */
    border: none;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    width: 100%;
    transition: all 0.3s ease;

.btn-agregar:hover {

}

/* Estilos de la Barra Lateral o Sección del Carrito */

.carrito-contenedor h3 {

#lista-carrito li {

.carrito-total {

.btn-pagar:hover {

    transform: translateY(-2px);
